<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a28" />
  <meta name="apple-mobile-web-app-title" content="Zoomer Simulator" />
  <title>Zoomer Simulator</title>
  <style>
    :root {
      --ink: #1a1410;
      --cream: #f3e6d4;
      --accent: #c45c26;
      --panel: rgba(26, 20, 16, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #87b5d9;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--cream);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game { position: fixed; inset: 0; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #title {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 16px; right: 16px;
    }
    #title h1 {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }
    #title p {
      margin-top: 4px;
      font-size: 0.85rem;
      opacity: 0.9;
      max-width: 42ch;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }
    #quest {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 14px;
      max-width: min(280px, 70vw);
      background: var(--panel);
      border: 1px solid rgba(243, 230, 212, 0.28);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(8px);
      text-shadow: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    #quest .qlabel {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    #quest .qtitle {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #quest .qstep {
      font-size: 0.82rem;
      opacity: 0.92;
      line-height: 1.35;
    }
    #quest.done {
      border-color: rgba(120, 200, 120, 0.55);
    }
    #title { right: min(300px, 72vw); }
    #prompt {
      position: absolute;
      bottom: max(180px, calc(env(safe-area-inset-bottom) + 220px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid rgba(243, 230, 212, 0.25);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    #prompt.visible { opacity: 1; }
    #toast {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel);
      border: 1px solid rgba(243, 230, 212, 0.3);
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 1.05rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    #toast.visible { opacity: 1; }
    #mobile-controls {
      position: absolute; inset: 0;
      pointer-events: none; display: none;
    }
    body.is-touch #mobile-controls { display: block; }
    .stick-zone {
      position: absolute;
      left: 0; top: 12%; bottom: 0; width: 62%;
      pointer-events: auto; touch-action: none;
    }
    .stick-base {
      position: absolute;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(26, 20, 16, 0.38);
      border: 2px solid rgba(243, 230, 212, 0.45);
      left: 18px;
      bottom: max(24px, env(safe-area-inset-bottom));
      opacity: 0.7;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .stick-zone.active .stick-base { opacity: 1; }
    .stick-knob {
      position: absolute;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(243, 230, 212, 0.82);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .stick-hint {
      position: absolute;
      left: 0; right: 0; bottom: 8px;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      opacity: 0.75;
      pointer-events: none;
      text-transform: uppercase;
    }
    .action-btns {
      position: absolute;
      right: 14px;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 8px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }
    .action-btn {
      width: 92px; height: 92px;
      border-radius: 50%;
      border: 2px solid rgba(243, 230, 212, 0.5);
      color: var(--cream);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      line-height: 1.05;
    }
    #btn-jump {
      background: rgba(70, 120, 160, 0.9);
      width: 108px; height: 108px;
      font-size: 1.15rem;
    }
    #btn-interact {
      background: rgba(196, 92, 38, 0.85);
      opacity: 0.55;
      transition: opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    #btn-interact.ready {
      opacity: 1;
      box-shadow: 0 0 0 4px rgba(243, 180, 80, 0.55), 0 6px 18px rgba(0, 0, 0, 0.35);
      animation: pulse-ready 1s ease-in-out infinite;
    }
    @keyframes pulse-ready {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .action-btn:active { transform: scale(0.94); filter: brightness(1.12); }
    body.is-touch #title p::after {
      content: " Chase the bunny · catch with E · drop on the porch.";
    }
    #help {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0.75;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      padding: 0 12px;
    }
    body.is-touch #help { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="title">
      <h1>Zoomer Simulator</h1>
      <p>Map 1 — W 153rd Terrace cul-de-sac, Olathe.</p>
    </div>
    <div id="quest" aria-live="polite">
      <div class="qlabel">Quest 1</div>
      <div class="qtitle">Bunny Delivery</div>
      <div class="qstep" id="quest-step">Catch the bunny hopping around the cul-de-sac.</div>
    </div>
    <div id="prompt" aria-live="polite"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="help">WASD walk · Shift / hard stick run · Space jump · E interact</div>
    <div id="mobile-controls">
      <div class="stick-zone" id="stick-zone">
        <div class="stick-base">
          <div class="stick-knob" id="stick-knob"></div>
          <div class="stick-hint">move</div>
        </div>
      </div>
      <div class="action-btns">
        <button type="button" class="action-btn" id="btn-jump" aria-label="Jump">JUMP</button>
        <button type="button" class="action-btn" id="btn-interact" aria-label="Interact">E</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("game");
    const promptEl = document.getElementById("prompt");
    const toastEl = document.getElementById("toast");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b5d9);
    scene.fog = new THREE.Fog(0x9ec4e0, 90, 220);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      350
    );

    // ——— Occlusion (houses/walls ghost when blocking Zoomer) ———
    const occluders = [];
    const OCCLUDE_OPACITY = 0.12;

    function makeOccluderMaterial(color, roughness = 0.85) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness: 0.02,
        transparent: true,
        opacity: 1,
        depthWrite: true,
      });
    }

    function registerOccluder(mesh) {
      mesh.userData.fade = 1;
      mesh.userData.isOccluder = true;
      occluders.push(mesh);
      return mesh;
    }

    // ——— Materials ———
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x4f8a45, roughness: 0.95 });
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.92 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xc9c5bc, roughness: 0.85 });
    const walkMat = new THREE.MeshStandardMaterial({ color: 0xd6d2c8, roughness: 0.9 });
    const driveMat = new THREE.MeshStandardMaterial({ color: 0xcfc9bc, roughness: 0.88 });
    const sidingA = makeOccluderMaterial(0xd8d0c4);
    const sidingB = makeOccluderMaterial(0xc9b8a4);
    const sidingC = makeOccluderMaterial(0xb9c4b0);
    const brickMat = makeOccluderMaterial(0x8a5a48, 0.8);
    const roofMat = makeOccluderMaterial(0x3d3d42, 0.75);
    const roofBrown = makeOccluderMaterial(0x5a4034, 0.75);
    const garageMat = makeOccluderMaterial(0x6e6a64, 0.7);
    const fenceMat = makeOccluderMaterial(0x6b5a45, 0.9);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.9 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f7a38, roughness: 0.85 });
    const leafDark = new THREE.MeshStandardMaterial({ color: 0x2f5e2c, roughness: 0.88 });
    const windowMat = new THREE.MeshStandardMaterial({
      color: 0xa8d4ef, emissive: 0x3a5a70, emissiveIntensity: 0.15, roughness: 0.35, metalness: 0.1,
    });
    const trimWhite = makeOccluderMaterial(0xe8e4dc, 0.7);
    const porchMat = new THREE.MeshStandardMaterial({ color: 0xb7a78c, roughness: 0.85 });
    const shrubMat = new THREE.MeshStandardMaterial({ color: 0x3d6b34, roughness: 0.9 });

    // ——— Ground / lawns (scaled so Zoomer feels cat-sized) ———
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(320, 240), grassMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Subtle lawn striping
    const lawnStripe = new THREE.MeshStandardMaterial({ color: 0x47853e, roughness: 1 });
    for (let i = -8; i <= 8; i++) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(300, 4.5), lawnStripe);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.01, i * 12);
      stripe.receiveShadow = true;
      scene.add(stripe);
    }

    // ——— Cul-de-sac road (≈ meters; houses ~2.5× prior size vs Zoomer) ———
    // +X = east, -Z = north, +Z = south.
    const ROAD_Y = 0.02;
    const roadW = 18;
    const stemLen = 170;
    const stemCenterX = -15;
    const bulbR = 32;
    const bulbCX = 82;
    const bulbCZ = 0;

    const stem = new THREE.Mesh(new THREE.PlaneGeometry(stemLen, roadW), roadMat);
    stem.rotation.x = -Math.PI / 2;
    stem.position.set(stemCenterX, ROAD_Y, 0);
    stem.receiveShadow = true;
    scene.add(stem);

    const bulb = new THREE.Mesh(new THREE.CircleGeometry(bulbR, 64), roadMat);
    bulb.rotation.x = -Math.PI / 2;
    bulb.position.set(bulbCX, ROAD_Y + 0.001, bulbCZ);
    bulb.receiveShadow = true;
    scene.add(bulb);

    // Center dashed line on stem
    for (let i = -6; i <= 5; i++) {
      const dash = new THREE.Mesh(
        new THREE.PlaneGeometry(4.5, 0.35),
        new THREE.MeshBasicMaterial({ color: 0xd8d4c8 })
      );
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(stemCenterX + i * 12, ROAD_Y + 0.025, 0);
      scene.add(dash);
    }

    const hillside = new THREE.Mesh(new THREE.PlaneGeometry(roadW, 70), roadMat);
    hillside.rotation.x = -Math.PI / 2;
    hillside.position.set(-88, ROAD_Y, 42);
    hillside.receiveShadow = true;
    scene.add(hillside);

    function sidewalk(len, x, z) {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(len, 2.4), walkMat);
      s.rotation.x = -Math.PI / 2;
      s.position.set(x, ROAD_Y + 0.015, z);
      s.receiveShadow = true;
      scene.add(s);
    }
    sidewalk(stemLen, stemCenterX, -(roadW / 2 + 2.2));
    sidewalk(stemLen, stemCenterX, roadW / 2 + 2.2);
    const walkRing = new THREE.Mesh(
      new THREE.RingGeometry(bulbR + 0.6, bulbR + 3.2, 64),
      walkMat
    );
    walkRing.rotation.x = -Math.PI / 2;
    walkRing.position.set(bulbCX, ROAD_Y + 0.016, bulbCZ);
    walkRing.receiveShadow = true;
    scene.add(walkRing);

    function curb(len, x, z) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(len, 0.18, 0.4), curbMat);
      c.position.set(x, 0.09, z);
      c.castShadow = true;
      scene.add(c);
    }
    curb(stemLen, stemCenterX, -roadW / 2);
    curb(stemLen, stemCenterX, roadW / 2);

    function addBox(parent, w, h, d, mat, x, y, z, occlude = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      if (occlude && mat.transparent) registerOccluder(m);
      return m;
    }

    function makeWindow(parent, x, y, z, ww = 1.6, wh = 1.4) {
      addBox(parent, ww + 0.25, wh + 0.25, 0.12, trimWhite, x, y, z, false);
      addBox(parent, ww, wh, 0.08, windowMat, x, y, z + 0.02, false);
      addBox(parent, 0.08, wh, 0.1, trimWhite, x, y, z + 0.05, false);
      addBox(parent, ww, 0.08, 0.1, trimWhite, x, y, z + 0.05, false);
    }

    function makeTree(x, z, scale = 1) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35 * scale, 0.5 * scale, 4.2 * scale, 7),
        trunkMat
      );
      trunk.position.y = 2.1 * scale;
      trunk.castShadow = true;
      g.add(trunk);
      const c1 = new THREE.Mesh(new THREE.SphereGeometry(2.4 * scale, 10, 10), leafMat);
      c1.position.set(0, 5.2 * scale, 0);
      c1.castShadow = true;
      g.add(c1);
      const c2 = new THREE.Mesh(new THREE.SphereGeometry(1.8 * scale, 8, 8), leafDark);
      c2.position.set(1.1 * scale, 4.6 * scale, 0.6 * scale);
      c2.castShadow = true;
      g.add(c2);
      const c3 = new THREE.Mesh(new THREE.SphereGeometry(1.6 * scale, 8, 8), leafMat);
      c3.position.set(-0.9 * scale, 4.8 * scale, -0.5 * scale);
      g.add(c3);
      scene.add(g);
      return g;
    }

    function makeShrub(parent, x, z, s = 1) {
      const bush = new THREE.Mesh(new THREE.SphereGeometry(0.7 * s, 8, 8), shrubMat);
      bush.position.set(x, 0.55 * s, z);
      bush.scale.y = 0.75;
      bush.castShadow = true;
      parent.add(bush);
    }

    function makeHouse(opts) {
      const {
        x, z, rotY = 0, w = 24, d = 18, stories = 2,
        siding = sidingA, roof = roofMat, label = "", home = false,
      } = opts;
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotY;
      scene.add(group);

      const h = stories === 2 ? 11.5 : 6.5;
      addBox(group, w, h, d, siding, 0, h / 2, 0);
      addBox(group, w + 0.12, 1.8, d + 0.12, brickMat, 0, 0.9, 0);
      // Gabled roof slabs
      const r1 = addBox(group, w + 1.2, 0.35, d * 0.7, roof, 0, h + 1.1, 0.35);
      r1.rotation.x = -0.42;
      const r2 = addBox(group, w + 1.2, 0.35, d * 0.7, roof, 0, h + 1.1, -0.35);
      r2.rotation.x = 0.42;
      // Chimney
      addBox(group, 1.4, 2.8, 1.4, brickMat, w * 0.28, h + 2.2, -d * 0.15);
      // Windows front
      makeWindow(group, -w * 0.28, h * 0.62, d / 2 + 0.05);
      makeWindow(group, w * 0.08, h * 0.62, d / 2 + 0.05);
      makeWindow(group, -w * 0.28, h * 0.28, d / 2 + 0.05, 1.5, 1.3);
      // Side windows
      makeWindow(group, -w / 2 - 0.05, h * 0.55, 0, 1.4, 1.3);
      // Garage
      addBox(group, 9.5, 4.6, 6.5, siding, w * 0.28, 2.3, d / 2 + 2.2);
      addBox(group, 8.2, 3.4, 0.25, garageMat, w * 0.28, 1.9, d / 2 + 5.4, false);
      addBox(group, 9.7, 0.3, 6.7, roof, w * 0.28, 4.7, d / 2 + 2.2);
      // Driveway
      const drive = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 16), driveMat);
      drive.rotation.x = -Math.PI / 2;
      drive.position.set(w * 0.28, ROAD_Y + 0.018, d / 2 + 12);
      group.add(drive);

      // Front walk
      const path = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 10), walkMat);
      path.rotation.x = -Math.PI / 2;
      path.position.set(-w * 0.22, ROAD_Y + 0.02, d / 2 + 6);
      group.add(path);

      makeShrub(group, -w * 0.4, d / 2 + 1.2, 1.1);
      makeShrub(group, -w * 0.15, d / 2 + 1.0, 0.9);
      makeShrub(group, w * 0.45, d / 2 + 1.1, 1.0);

      if (home) {
        // Covered porch for gift drop-off
        addBox(group, 8.5, 0.35, 4.2, porchMat, -w * 0.22, 0.35, d / 2 + 2.0, false);
        addBox(group, 0.35, 2.8, 0.35, trimWhite, -w * 0.22 - 3.8, 1.7, d / 2 + 3.8, false);
        addBox(group, 0.35, 2.8, 0.35, trimWhite, -w * 0.22 + 3.8, 1.7, d / 2 + 3.8, false);
        addBox(group, 8.7, 0.25, 4.4, roof, -w * 0.22, 3.2, d / 2 + 2.0);
        // Steps
        addBox(group, 3.2, 0.25, 1.1, porchMat, -w * 0.22, 0.2, d / 2 + 4.4, false);
        addBox(group, 3.2, 0.25, 1.1, porchMat, -w * 0.22, 0.45, d / 2 + 3.6, false);

        const door = addBox(
          group, 1.6, 3.0, 0.16, makeOccluderMaterial(0x5c3a24, 0.65),
          -w * 0.22, 1.85, d / 2 + 0.08
        );
        door.name = "homeDoor";
        group.userData.door = door;
        group.userData.doorLocal = new THREE.Vector3(-w * 0.22, 0.4, d / 2 + 0.8);
        group.userData.porchLocal = new THREE.Vector3(-w * 0.22, 0.55, d / 2 + 2.4);
        addBox(group, 2.0, 0.4, 0.1, makeOccluderMaterial(0x2a2a2e), -w * 0.22, 3.5, d / 2 + 0.12, false);

        // Mailbox by the curb
        const mail = new THREE.Group();
        mail.position.set(-w * 0.05, 0, d / 2 + 14);
        group.add(mail);
        addBox(mail, 0.12, 1.3, 0.12, trimWhite, 0, 0.65, 0, false);
        addBox(mail, 0.55, 0.4, 0.35, makeOccluderMaterial(0x2f4a7a), 0, 1.4, 0, false);
      }

      if (label) group.userData.label = label;
      group.userData.home = home;
      group.userData.hw = w / 2 + 1.5;
      group.userData.hd = d / 2 + 4;
      addBox(group, w + 8, 2.0, 0.18, fenceMat, 0, 1.0, -d / 2 - 12);
      return group;
    }

    // 18504 — north side, just west of bulb
    const home18504 = makeHouse({
      x: 18, z: -36, w: 26, d: 20, siding: sidingA, roof: roofMat,
      label: "18504", home: true,
    });
    makeHouse({ x: -16, z: -36, w: 24, d: 19, siding: sidingB, roof: roofBrown, label: "18524" });
    makeHouse({ x: -48, z: -36, w: 24, d: 18, siding: sidingC, roof: roofMat, label: "18544" });
    makeHouse({ x: -80, z: -36, w: 23, d: 18, siding: sidingA, roof: roofBrown, label: "18564" });

    makeHouse({ x: -16, z: 36, rotY: Math.PI, w: 24, d: 18, siding: sidingB, roof: roofMat, label: "18505" });
    makeHouse({ x: -48, z: 36, rotY: Math.PI, w: 24, d: 19, siding: sidingA, roof: roofBrown, label: "18475" });
    makeHouse({ x: -80, z: 36, rotY: Math.PI, w: 23, d: 18, siding: sidingC, roof: roofMat, label: "18585" });

    const bulbHomes = [
      { ang: -0.55, label: "18444", siding: sidingA },
      { ang: 0.15, label: "18424", siding: sidingB },
      { ang: 0.85, label: "18404", siding: sidingC },
      { ang: 1.55, label: "18405", siding: sidingA },
      { ang: 2.25, label: "18425", siding: sidingB },
      { ang: -1.25, label: "18445", siding: sidingC },
    ];
    for (const bh of bulbHomes) {
      const r = bulbR + 30;
      const hx = bulbCX + Math.cos(bh.ang) * r;
      const hz = bulbCZ + Math.sin(bh.ang) * r;
      makeHouse({

    function updateCatAnimation(dt, speedNow, moving) {
      if (!catState.onGround) {

      const runThreshold = catState.walkSpeed * 0.72;
      let gait = "idle";

        const sway = Math.sin(catState.animTime * 1.6) * 0.1;
        tailRoot.rotation.z = THREE.MathUtils.damp(tailRoot.rotation.z, 0.05 + sway * 0.3, 4, dt);
        tailRoot.rotation.x = THREE.MathUtils.damp(tailRoot.rotation.x, -0.15, 4, dt);
        tailRoot.rotation.y = THREE.MathUtils.damp(tailRoot.rotation.y, 0.35 + sway, 4, dt);
        for (let i = 0; i < tailSegs.length; i++) {
          tailSegs[i].rotation.y = THREE.MathUtils.damp(
            tailSegs[i].rotation.y,
            Math.sin(catState.animTime * 1.6 - i * 0.4) * 0.1,
            4, dt
          );
          tailSegs[i].rotation.x = THREE.MathUtils.damp(tailSegs[i].rotation.x, -0.12, 4, dt);
        }
        return;
      }

      const isRun = gait === "run";
      catState.animTime += dt * (isRun ? 14 : 9) * (0.55 + speedNow / catState.runSpeed);
      const t = catState.animTime;
      if (isRun) {
        const swing = Math.sin(t) * 0.7;
        const rear = Math.sin(t + Math.PI) * 0.75;
        legs[0].pivot.rotation.x = swing;
        legs[1].pivot.rotation.x = swing * 0.92;
        legs[2].pivot.rotation.x = rear;
        legs[3].pivot.rotation.x = rear * 0.92;
        legs[0].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.5;
        legs[1].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.5;
        legs[2].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.55;
        legs[3].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.55;
        torso.position.y = 0.38 + Math.abs(Math.sin(t)) * 0.07;
        torso.rotation.x = Math.sin(t) * 0.12;
        head.rotation.x = -Math.sin(t) * 0.08;
        tailRoot.rotation.x = -0.05 + Math.sin(t) * 0.2;
        tailRoot.rotation.y = Math.sin(t * 0.5) * 0.15;
        for (let i = 0; i < tailSegs.length; i++) {
          tailSegs[i].rotation.x = -0.08 + Math.sin(t - i * 0.35) * 0.15;
          tailSegs[i].rotation.y = 0;

        legs[3].pivot.rotation.x = a;

        legs[0].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.35;
        legs[3].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.35;
        legs[1].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.35;
        legs[2].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.35;
        torso.position.y = 0.38 + Math.abs(Math.sin(t * 2)) * 0.025;

    function tryInteract() {

    function updateBunny(dt) {
      if (quest.stage === "carry") {
        const hold = new THREE.Vector3(0.15, 0.75, 0.35);
        hold.applyAxisAngle(new THREE.Vector3(0, 1, 0), catState.yaw);
        bunny.position.lerp(cat.position.clone().add(hold), 1 - Math.exp(-14 * dt));
        bunny.rotation.y = catState.yaw;
        bunnyState.hop += dt * 10;
        bunny.position.y = 0.75 + Math.abs(Math.sin(bunnyState.hop)) * 0.04;
        return;
      }
      if (quest.stage === "done") {
        bunnyState.hop += dt * 2;
        bunny.position.y = porchWorld.y + Math.abs(Math.sin(bunnyState.hop)) * 0.02;
        return;
      }

      // Hunt AI: wander, flee when Zoomer gets close
      const dx = bunny.position.x - cat.position.x;
      const dz = bunny.position.z - cat.position.z;
      const distCat = Math.hypot(dx, dz);
      const flee = distCat < 10;

      let tx, tz, targetSpeed;
      if (flee) {
        bunnyState.panic = 1.2;
        const len = distCat || 1;
        tx = bunny.position.x + (dx / len) * 14;
        tz = bunny.position.z + (dz / len) * 14;
        targetSpeed = 6.6;
      } else {
        bunnyState.panic = Math.max(0, bunnyState.panic - dt);
        const wp = bunnyWaypoints[bunnyState.waypoint % bunnyWaypoints.length];
        tx = wp[0]; tz = wp[1];
        targetSpeed = bunnyState.panic > 0 ? 5.0 : 3.0;
        if (Math.hypot(tx - bunny.position.x, tz - bunny.position.z) < 2.5) {
          bunnyState.waypoint++;
        }
      }

      const toX = tx - bunny.position.x;
      const toZ = tz - bunny.position.z;
      const desiredYaw = Math.atan2(toX, toZ);
      let turn = desiredYaw - bunnyState.yaw;
      while (turn > Math.PI) turn -= Math.PI * 2;
      while (turn < -Math.PI) turn += Math.PI * 2;
      bunnyState.yaw += turn * Math.min(1, 8 * dt);
      bunny.rotation.y = bunnyState.yaw;
      bunnyState.speed = THREE.MathUtils.damp(bunnyState.speed, targetSpeed, 6, dt);
      bunny.position.x += Math.sin(bunnyState.yaw) * bunnyState.speed * dt;
      bunny.position.z += Math.cos(bunnyState.yaw) * bunnyState.speed * dt;
      // Soft bounds
      bunny.position.x = THREE.MathUtils.clamp(bunny.position.x, -110, 130);
      bunny.position.z = THREE.MathUtils.clamp(bunny.position.z, -70, 70);

      bunnyState.hop += dt * (8 + bunnyState.speed);
      bunny.position.y = Math.abs(Math.sin(bunnyState.hop)) * 0.18;
      bunnyMarker.position.x = bunny.position.x;
      bunnyMarker.position.z = bunny.position.z;
    }

    const stickKnob = document.getElementById("stick-knob");
    // Smaller radius = full speed with a short thumb drag (easier on phones)
    const STICK_MAX = 38;
    const STICK_DEAD = 0.05;
    const STICK_SIZE = 150;

    function placeStickBase(clientX, clientY) {
      const size = STICK_SIZE;
      const x = THREE.MathUtils.clamp(clientX - size / 2, 4, window.innerWidth * 0.62 - size - 4);
      const y = THREE.MathUtils.clamp(
        clientY - size / 2,
        window.innerHeight * 0.12,
        window.innerHeight - size - 4
      );
      stickBase.style.left = `${x}px`;
      stickBase.style.top = `${y}px`;
      stickBase.style.bottom = "auto";
      stick.originX = x + size / 2;
      stick.originY = y + size / 2;
    }

    function setStickFromPointer(clientX, clientY) {
      let dx = clientX - stick.originX;
      let dy = clientY - stick.originY;
      let len = Math.hypot(dx, dy) || 1;

      // Keep stick at full tilt when thumb slides past the rim (easier continuous run)
      if (len > STICK_MAX) {
        const pull = len - STICK_MAX;
        stick.originX += (dx / len) * pull;
        stick.originY += (dy / len) * pull;
        // Keep the visible base roughly under the origin
        stickBase.style.left = `${stick.originX - STICK_SIZE / 2}px`;
        stickBase.style.top = `${stick.originY - STICK_SIZE / 2}px`;
        dx = clientX - stick.originX;
        dy = clientY - stick.originY;
        len = Math.hypot(dx, dy) || 1;
      }

      const clamped = Math.min(len, STICK_MAX);
      dx = (dx / len) * clamped;
      dy = (dy / len) * clamped;
      let nx = dx / STICK_MAX;
      let ny = dy / STICK_MAX;
      const mag = Math.hypot(nx, ny);
      if (mag < STICK_DEAD) {
        stick.x = 0; stick.y = 0;
      } else {
        // Gentle ease-in so small nudges still move, full tilt comes quick
        const shaped = Math.pow((mag - STICK_DEAD) / (1 - STICK_DEAD), 0.85);
        stick.x = (nx / mag) * Math.min(1, shaped);
        stick.y = (ny / mag) * Math.min(1, shaped);
      }
      stickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function resetStick() {
      stick.x = 0; stick.y = 0; stick.active = false; stick.pointerId = null;
      stickZone.classList.remove("active");
      stickKnob.style.transform = "translate(-50%, -50%)";
      stickBase.style.left = "18px";
      stickBase.style.top = "auto";
      stickBase.style.bottom = "max(24px, env(safe-area-inset-bottom))";
    }

    stickZone.addEventListener("pointerdown", (e) => {
      if (stick.active) return;
      e.preventDefault();
      stick.active = true;
      stick.pointerId = e.pointerId;
      stickZone.classList.add("active");
      placeStickBase(e.clientX, e.clientY);
      try { stickZone.setPointerCapture(e.pointerId); } catch (_) {}
      setStickFromPointer(e.clientX, e.clientY);
    });
    stickZone.addEventListener("pointermove", (e) => {
      if (!stick.active || e.pointerId !== stick.pointerId) return;
      e.preventDefault();
      setStickFromPointer(e.clientX, e.clientY);
    });
    function endStick(e) {
      if (stick.pointerId !== null && e.pointerId !== stick.pointerId) return;
      resetStick();
    }
    stickZone.addEventListener("pointerup", endStick);
    stickZone.addEventListener("pointercancel", endStick);
    stickZone.addEventListener("lostpointercapture", () => { if (stick.active) resetStick(); });

    // ——— Camera ———
    let camYaw = 0;
    const camDist = 11;
    const camHeight = 5.5;
    const camLook = new THREE.Vector3();
    const camPos = new THREE.Vector3();

    function shortestAngle(from, to) {
      let d = ((to - from + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    const _camForward = new THREE.Vector3();
    const _camRight = new THREE.Vector3();

    function updateCamera(dt) {
      // Smooth yaw follow — Zoomer’s model faces +Z, so behind = opposite that
      camYaw += shortestAngle(camYaw, catState.yaw) * (1 - Math.exp(-2.0 * dt));
      const faceX = Math.sin(camYaw);
      const faceZ = Math.cos(camYaw);
      const desired = new THREE.Vector3(
        cat.position.x - faceX * camDist,
        cat.position.y + camHeight,
        cat.position.z - faceZ * camDist
      );
      camPos.lerp(desired, 1 - Math.exp(-7 * dt));
      camera.position.copy(camPos);
      camLook.set(cat.position.x, cat.position.y + 0.75, cat.position.z);
      camera.lookAt(camLook);
    }

    // Robust occlusion: multi-ray + camera-inside / near-mesh fade
    const occludeRay = new THREE.Raycaster();
    const _box = new THREE.Box3();
    const _origin = new THREE.Vector3();
    const _target = new THREE.Vector3();
    const _dir = new THREE.Vector3();
    const _side = new THREE.Vector3();
    const _up = new THREE.Vector3(0, 1, 0);

    function updateOcclusion(dt) {
      _origin.copy(camera.position);
      _target.set(cat.position.x, cat.position.y + 0.65, cat.position.z);
      _dir.subVectors(_target, _origin);
      const dist = _dir.length();
      if (dist < 0.05) return;
      _dir.multiplyScalar(1 / dist);
      _side.crossVectors(_dir, _up).normalize();

      const blocking = new Set();
      const offsets = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0.35, 0),
        _side.clone().multiplyScalar(0.35),
        _side.clone().multiplyScalar(-0.35),
      ];

      for (const off of offsets) {
        const o = _origin.clone().add(off);
        const t = _target.clone().add(off);
        const d = t.clone().sub(o);
        const len = d.length();
        if (len < 0.05) continue;
        d.multiplyScalar(1 / len);
        occludeRay.set(o, d);
        occludeRay.near = 0.02;
        occludeRay.far = len;
        const hits = occludeRay.intersectObjects(occluders, false);
        for (const hit of hits) {
          if (hit.distance < len - 0.02) blocking.add(hit.object);
        }
      }

      // Also ghost meshes the camera is inside or extremely close to
      for (const mesh of occluders) {
        _box.setFromObject(mesh);
        if (_box.containsPoint(_origin) || _box.distanceToPoint(_origin) < 0.85) {
          blocking.add(mesh);
        }
      }

      for (const mesh of occluders) {
        const want = blocking.has(mesh) ? OCCLUDE_OPACITY : 1;
        // Snap faster so “see-through” is obvious on phones
        mesh.userData.fade = THREE.MathUtils.damp(mesh.userData.fade, want, 18, dt);
        const mat = mesh.material;
        if (Array.isArray(mat)) continue;
        mat.transparent = true;
        mat.opacity = mesh.userData.fade;
        mat.depthWrite = mesh.userData.fade > 0.92;
        mesh.renderOrder = mesh.userData.fade < 0.95 ? 2 : 0;
        mesh.castShadow = mesh.userData.fade > 0.55;
      }
    }

    const BOUNDS = { minX: -115, maxX: 140, minZ: -75, maxZ: 80 };
    function clampCat() {
      cat.position.x = THREE.MathUtils.clamp(cat.position.x, BOUNDS.minX, BOUNDS.maxX);
      cat.position.z = THREE.MathUtils.clamp(cat.position.z, BOUNDS.minZ, BOUNDS.maxZ);
    }

    const houseBlocks = [];
    scene.traverse((obj) => {
      if (obj.isGroup && obj.userData && (obj.userData.label || obj.userData.home)) {
        houseBlocks.push({
          group: obj,
          hw: obj.userData.hw || 14,
          hd: obj.userData.hd || 14,
        });
      }
    });

    function resolveHouseCollisions() {
      for (const hb of houseBlocks) {
        const local = hb.group.worldToLocal(cat.position.clone());
        if (Math.abs(local.x) < hb.hw && Math.abs(local.z) < hb.hd) {
          const px = hb.hw - Math.abs(local.x);
          const pz = hb.hd - Math.abs(local.z);
          if (px < pz) local.x = Math.sign(local.x || 1) * hb.hw;
          else local.z = Math.sign(local.z || 1) * hb.hd;
          const world = hb.group.localToWorld(local);
          cat.position.x = world.x;
          cat.position.z = world.z;
        }
      }
    }

    // ——— Loop ———
    const clock = new THREE.Clock();
    let markerPulse = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      markerPulse += dt;

      let ix = 0, iz = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) iz -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) iz += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) ix -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) ix += 1;
      ix += stick.x;
      iz += stick.y;
      const inputLen = Math.hypot(ix, iz);
      if (inputLen > 1) { ix /= inputLen; iz /= inputLen; }

      // Stick directions from the actual camera view (fixes 180° mismatch)
      camera.getWorldDirection(_camForward);
      _camForward.y = 0;
      if (_camForward.lengthSq() < 1e-6) _camForward.set(0, 0, 1);
      else _camForward.normalize();
      // Strafe: forward × up so stick-right matches screen-right in chase cam
      _camRight.crossVectors(_camForward, _up).normalize();
      // iz < 0 (stick up / W) → into the scene along camera look
      const dirX = _camForward.x * -iz + _camRight.x * ix;
      const dirZ = _camForward.z * -iz + _camRight.z * ix;
      const wishLen = Math.hypot(dirX, dirZ);
      const moving = wishLen > 0.001 && inputLen > 0.02;
      // Phones: any real stick tilt = run (Zoomer zooms). Desktop keeps Shift / hard push.
      const wantRun = moving && (
        isTouchUI
          ? inputLen > 0.18
          : (inputLen > 0.65 || keys["ShiftLeft"] || keys["ShiftRight"])
      );
      catState.speed = wantRun ? catState.runSpeed : catState.walkSpeed;

      let targetVX = 0, targetVZ = 0;
      if (moving) {
        const scale = Math.min(inputLen, 1) * catState.speed;
        targetVX = (dirX / wishLen) * scale;
        targetVZ = (dirZ / wishLen) * scale;
        const desiredYaw = Math.atan2(dirX, dirZ);
        catState.yaw += shortestAngle(catState.yaw, desiredYaw) * (1 - Math.exp(-catState.turnSpeed * dt));
        cat.rotation.y = catState.yaw;
      }

      const rate = moving ? catState.accel : catState.friction;
      const blend = 1 - Math.exp(-rate * dt);
      catState.velX += (targetVX - catState.velX) * blend;
      catState.velZ += (targetVZ - catState.velZ) * blend;
      cat.position.x += catState.velX * dt;
      cat.position.z += catState.velZ * dt;

      const speedNow = Math.hypot(catState.velX, catState.velZ);
      updateCatAnimation(dt, speedNow, moving || speedNow > 0.2);

      if ((keys["Space"] || keys["KeyJ"] || catState.jumpQueued) && catState.onGround) {
        catState.velY = catState.jumpForce;
        catState.onGround = false;
        catState.jumpQueued = false;
        for (const leg of legs) {
          leg.pivot.rotation.x = -0.55;
          leg.lower.rotation.x = 0.7;
        }
        torso.rotation.x = -0.15;
      } else {
        catState.jumpQueued = false;
      }
      catState.velY -= catState.gravity * dt;
      cat.position.y += catState.velY * dt;
      if (!catState.onGround) {
        const tuck = catState.velY > 0 ? -0.45 : -0.2;
        for (const leg of legs) {
          leg.pivot.rotation.x = THREE.MathUtils.damp(leg.pivot.rotation.x, tuck, 10, dt);
        }
        torso.position.y = THREE.MathUtils.damp(torso.position.y, 0.34, 8, dt);
        tailRoot.rotation.x = THREE.MathUtils.damp(tailRoot.rotation.x, 0.35, 8, dt);
      }
      if (cat.position.y <= 0) {
        cat.position.y = 0;
        catState.velY = 0;
        catState.onGround = true;
      }

      clampCat();
      resolveHouseCollisions();
      updateBunny(dt);

      const pulse = 0.4 + Math.sin(markerPulse * 3) * 0.2;
      if (bunnyMarker.visible) bunnyMarker.material.opacity = pulse;
      if (porchMarker.visible) porchMarker.material.opacity = pulse;

      nearest = null;
      let bestDist = Infinity;
      const catXZ = new THREE.Vector2(cat.position.x, cat.position.z);
      function horizDist(pos) {
        return catXZ.distanceTo(new THREE.Vector2(pos.x, pos.z));
      }

      if (quest.stage === "hunt") {
        const dBunny = horizDist(bunny.position);
        // Must get close — bunny flees inside ~10m, catch range is tighter
        if (dBunny < 2.4 && dBunny < bestDist) {
          nearest = "bunny";
          bestDist = dBunny;
        }
      } else if (quest.stage === "carry") {
        home18504.localToWorld(porchWorld.copy(home18504.userData.porchLocal));
        porchMarker.position.x = porchWorld.x;
        porchMarker.position.z = porchWorld.z;
        const dPorch = horizDist(porchWorld);
        if (dPorch < 3.5) {
          nearest = "porch";
          bestDist = dPorch;
        }
      }

      if (nearest === "bunny") {
        promptEl.textContent = "Tap E to catch the bunny!";
        promptEl.classList.add("visible");
      } else if (nearest === "porch") {
        promptEl.textContent = "Tap E to leave the bunny on the porch";
        promptEl.classList.add("visible");
      } else {
        promptEl.classList.remove("visible");
      }

      if (nearest) btnInteract.classList.add("ready");
      else btnInteract.classList.remove("ready");

      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toastEl.classList.remove("visible");
      }

      updateCamera(dt);
      updateOcclusion(dt);
      renderer.render(scene, camera);
    }

    camPos.set(
      cat.position.x - Math.sin(camYaw) * camDist,
      camHeight,
      cat.position.z - Math.cos(camYaw) * camDist
    );
    camera.position.copy(camPos);
    camera.lookAt(cat.position.x, cat.position.y + 0.75, cat.position.z);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
