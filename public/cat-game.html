<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a28" />
  <meta name="apple-mobile-web-app-title" content="Zoomer Simulator" />
  <title>Zoomer Simulator</title>
  <style>
    :root {
      --ink: #1a1410;
      --cream: #f3e6d4;
      --accent: #c45c26;
      --panel: rgba(26, 20, 16, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #87b5d9;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--cream);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game { position: fixed; inset: 0; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #title {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 16px; right: 16px;
    }
    #title h1 {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }
    #title p {
      margin-top: 4px;
      font-size: 0.85rem;
      opacity: 0.9;
      max-width: 42ch;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }
    #prompt {
      position: absolute;
      bottom: max(180px, calc(env(safe-area-inset-bottom) + 220px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid rgba(243, 230, 212, 0.25);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    #prompt.visible { opacity: 1; }
    #toast {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel);
      border: 1px solid rgba(243, 230, 212, 0.3);
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 1.05rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    #toast.visible { opacity: 1; }
    #mobile-controls {
      position: absolute; inset: 0;
      pointer-events: none; display: none;
    }
    body.is-touch #mobile-controls { display: block; }
    .stick-zone {
      position: absolute;
      left: 0; top: 12%; bottom: 0; width: 62%;
      pointer-events: auto; touch-action: none;
    }
    .stick-base {
      position: absolute;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(26, 20, 16, 0.38);
      border: 2px solid rgba(243, 230, 212, 0.45);
      left: 18px;
      bottom: max(24px, env(safe-area-inset-bottom));
      opacity: 0.7;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .stick-zone.active .stick-base { opacity: 1; }
    .stick-knob {
      position: absolute;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(243, 230, 212, 0.82);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .stick-hint {
      position: absolute;
      left: 0; right: 0; bottom: 8px;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      opacity: 0.75;
      pointer-events: none;
      text-transform: uppercase;
    }
    .action-btns {
      position: absolute;
      right: 14px;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 8px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }
    .action-btn {
      width: 92px; height: 92px;
      border-radius: 50%;
      border: 2px solid rgba(243, 230, 212, 0.5);
      color: var(--cream);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      line-height: 1.05;
    }
    #btn-jump {
      background: rgba(70, 120, 160, 0.9);
      width: 108px; height: 108px;
      font-size: 1.15rem;
    }
    #btn-interact {
      background: rgba(196, 92, 38, 0.85);
      opacity: 0.55;
      transition: opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    #btn-interact.ready {
      opacity: 1;
      box-shadow: 0 0 0 4px rgba(243, 180, 80, 0.55), 0 6px 18px rgba(0, 0, 0, 0.35);
      animation: pulse-ready 1s ease-in-out infinite;
    }
    @keyframes pulse-ready {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .action-btn:active { transform: scale(0.94); filter: brightness(1.12); }
    body.is-touch #title p::after {
      content: " Drag left to move (auto-runs) · big JUMP · E lights up near stuff.";
    }
    #help {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0.75;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      padding: 0 12px;
    }
    body.is-touch #help { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="title">
      <h1>Zoomer Simulator</h1>
      <p>Map 1 — W 153rd Terrace cul-de-sac, Olathe. Run the block as Zoomer.</p>
    </div>
    <div id="prompt" aria-live="polite"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="help">WASD walk · Shift / hard stick run · Space jump · E interact</div>
    <div id="mobile-controls">
      <div class="stick-zone" id="stick-zone">
        <div class="stick-base">
          <div class="stick-knob" id="stick-knob"></div>
          <div class="stick-hint">move</div>
        </div>
      </div>
      <div class="action-btns">
        <button type="button" class="action-btn" id="btn-jump" aria-label="Jump">JUMP</button>
        <button type="button" class="action-btn" id="btn-interact" aria-label="Interact">E</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("game");
    const promptEl = document.getElementById("prompt");
    const toastEl = document.getElementById("toast");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b5d9);
    scene.fog = new THREE.Fog(0x9ec4e0, 55, 120);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );

    // ——— Occlusion (houses/walls ghost when blocking Zoomer) ———
    const occluders = [];
    const OCCLUDE_OPACITY = 0.12;

    function makeOccluderMaterial(color, roughness = 0.85) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness: 0.02,
        transparent: true,
        opacity: 1,
        depthWrite: true,
      });
    }

    function registerOccluder(mesh) {
      mesh.userData.fade = 1;
      mesh.userData.isOccluder = true;
      occluders.push(mesh);
      return mesh;
    }

    // ——— Materials ———
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x4f8a45, roughness: 0.95 });
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.92 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xc9c5bc, roughness: 0.85 });
    const walkMat = new THREE.MeshStandardMaterial({ color: 0xd6d2c8, roughness: 0.9 });
    const driveMat = new THREE.MeshStandardMaterial({ color: 0xcfc9bc, roughness: 0.88 });
    const sidingA = makeOccluderMaterial(0xd8d0c4);
    const sidingB = makeOccluderMaterial(0xc9b8a4);
    const sidingC = makeOccluderMaterial(0xb9c4b0);
    const brickMat = makeOccluderMaterial(0x8a5a48, 0.8);
    const roofMat = makeOccluderMaterial(0x3d3d42, 0.75);
    const roofBrown = makeOccluderMaterial(0x5a4034, 0.75);
    const garageMat = makeOccluderMaterial(0x6e6a64, 0.7);
    const fenceMat = makeOccluderMaterial(0x6b5a45, 0.9);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.9 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f7a38, roughness: 0.85 });

    // ——— Ground / lawns ———
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 120), grassMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ——— Cul-de-sac road: E–W stem + eastern bulb (rough W 153rd Terrace) ———
    // Units ≈ meters. +X = east, -Z = north, +Z = south.
    const ROAD_Y = 0.02;
    const roadW = 7.2;
    const stemLen = 78;
    const stemCenterX = -8; // stem from ~-47 to ~31
    const bulbR = 14;
    const bulbCX = 38;
    const bulbCZ = 0;

    const stem = new THREE.Mesh(
      new THREE.PlaneGeometry(stemLen, roadW),
      roadMat
    );
    stem.rotation.x = -Math.PI / 2;
    stem.position.set(stemCenterX, ROAD_Y, 0);
    stem.receiveShadow = true;
    scene.add(stem);

    const bulb = new THREE.Mesh(new THREE.CircleGeometry(bulbR, 48), roadMat);
    bulb.rotation.x = -Math.PI / 2;
    bulb.position.set(bulbCX, ROAD_Y + 0.001, bulbCZ);
    bulb.receiveShadow = true;
    scene.add(bulb);

    // Hillside St stub (T-junction from south into 153rd)
    const hillside = new THREE.Mesh(new THREE.PlaneGeometry(roadW, 36), roadMat);
    hillside.rotation.x = -Math.PI / 2;
    hillside.position.set(-42, ROAD_Y, 22);
    hillside.receiveShadow = true;
    scene.add(hillside);

    // Sidewalks along stem (both sides)
    function sidewalk(len, x, z, rot = 0) {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(len, 1.4), walkMat);
      s.rotation.x = -Math.PI / 2;
      s.rotation.z = rot;
      s.position.set(x, ROAD_Y + 0.015, z);
      s.receiveShadow = true;
      scene.add(s);
    }
    sidewalk(stemLen, stemCenterX, -(roadW / 2 + 1.1));
    sidewalk(stemLen, stemCenterX, roadW / 2 + 1.1);
    // Bulb ring sidewalk (approx using torus flat)
    const walkRing = new THREE.Mesh(
      new THREE.RingGeometry(bulbR + 0.4, bulbR + 1.8, 48),
      walkMat
    );
    walkRing.rotation.x = -Math.PI / 2;
    walkRing.position.set(bulbCX, ROAD_Y + 0.016, bulbCZ);
    walkRing.receiveShadow = true;
    scene.add(walkRing);

    // Curbs along stem edges
    function curb(len, x, z) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 0.25), curbMat);
      c.position.set(x, 0.06, z);
      c.castShadow = true;
      scene.add(c);
    }
    curb(stemLen, stemCenterX, -roadW / 2);
    curb(stemLen, stemCenterX, roadW / 2);

    // ——— Simple suburban house builder ———
    function addBox(parent, w, h, d, mat, x, y, z, occlude = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      if (occlude && mat.transparent) registerOccluder(m);
      return m;
    }

    function makeTree(x, z, scale = 1) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18 * scale, 0.25 * scale, 2.2 * scale, 6),
        trunkMat
      );
      trunk.position.y = 1.1 * scale;
      trunk.castShadow = true;
      g.add(trunk);
      const canopy = new THREE.Mesh(
        new THREE.SphereGeometry(1.6 * scale, 10, 10),
        leafMat
      );
      canopy.position.y = 3.0 * scale;
      canopy.castShadow = true;
      g.add(canopy);
      scene.add(g);
      return g;
    }

    function makeHouse(opts) {
      const {
        x, z, rotY = 0, w = 11, d = 9, stories = 2,
        siding = sidingA, roof = roofMat, label = "", home = false,
      } = opts;
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotY;
      scene.add(group);

      const h = stories === 2 ? 5.6 : 3.4;
      addBox(group, w, h, d, siding, 0, h / 2, 0);
      // Brick accent band
      addBox(group, w + 0.05, 1.1, d + 0.05, brickMat, 0, 0.55, 0);
      // Roof (simple gable-ish: two slabs)
      const roofH = 1.4;
      const r1 = addBox(group, w + 0.6, 0.25, d * 0.72, roof, 0, h + 0.5, 0.15);
      r1.rotation.x = -0.35;
      const r2 = addBox(group, w + 0.6, 0.25, d * 0.72, roof, 0, h + 0.5, -0.15);
      r2.rotation.x = 0.35;
      // Garage bump on street side (+local Z)
      addBox(group, 5.2, 2.6, 3.2, siding, w * 0.22, 1.3, d / 2 + 1.0);
      addBox(group, 4.4, 2.0, 0.2, garageMat, w * 0.22, 1.1, d / 2 + 2.55, false);
      // Driveway toward street
      const drive = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 8), driveMat);
      drive.rotation.x = -Math.PI / 2;
      drive.position.set(w * 0.22, ROAD_Y + 0.018, d / 2 + 6);
      group.add(drive);

      if (home) {
        // Front door (interactive)
        const door = addBox(
          group,
          1.1,
          2.2,
          0.12,
          makeOccluderMaterial(0x5c3a24, 0.65),
          -1.4,
          1.15,
          d / 2 + 0.06
        );
        door.name = "homeDoor";
        group.userData.door = door;
        group.userData.doorLocal = new THREE.Vector3(-1.4, 0, d / 2 + 0.5);

        // Address plaque vibe
        const plaque = addBox(group, 1.4, 0.35, 0.08, makeOccluderMaterial(0x2a2a2e), -1.4, 2.5, d / 2 + 0.08, false);
      }

      if (label) group.userData.label = label;
      group.userData.home = home;
      // Back fence
      addBox(group, w + 4, 1.3, 0.12, fenceMat, 0, 0.65, -d / 2 - 6);
      return group;
    }

    // North-side houses facing south (rotY = 0 means local +Z is street)
    // 18504 is just west of bulb entrance on north side
    const home18504 = makeHouse({
      x: 8, z: -16.5, w: 12, d: 10, siding: sidingA, roof: roofMat,
      label: "18504", home: true,
    });
    makeHouse({ x: -6, z: -16.5, w: 11, d: 9.5, siding: sidingB, roof: roofBrown, label: "18524" });
    makeHouse({ x: -20, z: -16.5, w: 11, d: 9, siding: sidingC, roof: roofMat, label: "18544" });
    makeHouse({ x: -34, z: -16.5, w: 10.5, d: 9, siding: sidingA, roof: roofBrown, label: "18564" });

    // South-side houses facing north (rotate 180°)
    makeHouse({ x: -6, z: 16.5, rotY: Math.PI, w: 11, d: 9, siding: sidingB, roof: roofMat, label: "18505" });
    makeHouse({ x: -20, z: 16.5, rotY: Math.PI, w: 11, d: 9.5, siding: sidingA, roof: roofBrown, label: "18475" });
    makeHouse({ x: -34, z: 16.5, rotY: Math.PI, w: 10.5, d: 9, siding: sidingC, roof: roofMat, label: "18585" });

    // Houses around the bulb — radial, facing center
    const bulbHomes = [
      { ang: -0.55, label: "18444", siding: sidingA },
      { ang: 0.15, label: "18424", siding: sidingB },
      { ang: 0.85, label: "18404", siding: sidingC },
      { ang: 1.55, label: "18405", siding: sidingA },
      { ang: 2.25, label: "18425", siding: sidingB },
      { ang: -1.25, label: "18445", siding: sidingC },
    ];
    for (const bh of bulbHomes) {
      const r = bulbR + 15;
      const hx = bulbCX + Math.cos(bh.ang) * r;
      const hz = bulbCZ + Math.sin(bh.ang) * r;
      // Face toward bulb center
      const rot = bh.ang + Math.PI;
      makeHouse({
        x: hx, z: hz, rotY: rot, w: 10.5, d: 9,
        siding: bh.siding, roof: Math.random() > 0.5 ? roofMat : roofBrown,
        label: bh.label,
      });
    }

    // Trees — front yards + buffer north
    const treeSpots = [
      [8, -10], [12, -11], [4, -9.5], [-6, -10], [-20, -10.5], [-34, -10],
      [-6, 10], [-20, 10.5], [-34, 11],
      [8, -28], [-10, -30], [20, -26], [45, -8], [50, 8], [55, -2],
      [30, 22], [42, 24], [-45, -8], [-48, 10], [0, -32],
      [bulbCX + 8, bulbCZ - 20], [bulbCX - 2, bulbCZ + 22],
    ];
    for (const [tx, tz] of treeSpots) makeTree(tx, tz, 0.85 + Math.random() * 0.45);

    // Street label markers (flat)
    function streetLabel(text, x, z) {
      // simple asphalt paint stripe as stand-in
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(6, 0.35),
        new THREE.MeshBasicMaterial({ color: 0xf0f0f0 })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, ROAD_Y + 0.03, z);
      scene.add(m);
    }
    streetLabel("153rd", -10, 0);
    streetLabel("bulb", bulbCX, 0);

    // ——— Lighting (outdoor daytime) ———
    scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x5a6a40, 0.7));
    const sun = new THREE.DirectionalLight(0xfff2d6, 1.25);
    sun.position.set(-30, 45, -20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 5;
    sun.shadow.camera.far = 120;
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    scene.add(sun);

    // ——— Zoomer ———
    const cat = new THREE.Group();
    scene.add(cat);
    // Spawn in front yard of 18504
    cat.position.set(8, 0, -8);

    const fur = new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.72, metalness: 0.04 });
    const furDark = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.75 });
    const furStripe = new THREE.MeshStandardMaterial({ color: 0x232328, roughness: 0.8 });
    const earInner = new THREE.MeshStandardMaterial({ color: 0x6a5a5c, roughness: 0.85 });
    const noseMat = new THREE.MeshStandardMaterial({ color: 0x1c1c20, roughness: 0.55 });
    const eyeAmber = new THREE.MeshStandardMaterial({
      color: 0xf0c420, emissive: 0xc49210, emissiveIntensity: 0.35, roughness: 0.35,
    });
    const eyePupil = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.4 });
    const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.6 });

    function addMesh(parent, geo, mat, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      m.rotation.set(rx, ry, rz);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    const torso = new THREE.Group();
    torso.position.y = 0.38;
    cat.add(torso);
    addMesh(torso, new THREE.BoxGeometry(0.42, 0.34, 0.72), fur, 0, 0.02, -0.02);
    addMesh(torso, new THREE.BoxGeometry(0.4, 0.32, 0.36), fur, 0, 0.04, 0.34);
    addMesh(torso, new THREE.BoxGeometry(0.36, 0.28, 0.28), furDark, 0, 0.0, -0.38);

    const head = new THREE.Group();
    head.position.set(0, 0.22, 0.58);
    torso.add(head);
    addMesh(head, new THREE.BoxGeometry(0.36, 0.32, 0.34), fur, 0, 0.02, 0);
    addMesh(head, new THREE.BoxGeometry(0.2, 0.14, 0.16), fur, 0, -0.04, 0.2);
    addMesh(head, new THREE.BoxGeometry(0.07, 0.045, 0.05), noseMat, 0, -0.02, 0.29);
    addMesh(head, new THREE.ConeGeometry(0.1, 0.2, 4), fur, -0.12, 0.24, -0.02, 1, 1, 0.85, 0, 0, -0.2);
    addMesh(head, new THREE.ConeGeometry(0.1, 0.2, 4), fur, 0.12, 0.24, -0.02, 1, 1, 0.85, 0, 0, 0.2);
    addMesh(head, new THREE.ConeGeometry(0.05, 0.11, 4), earInner, -0.12, 0.22, 0.0);
    addMesh(head, new THREE.ConeGeometry(0.05, 0.11, 4), earInner, 0.12, 0.22, 0.0);

    function makeEye(x) {
      const eye = new THREE.Group();
      eye.position.set(x, 0.08, 0.15);
      head.add(eye);
      addMesh(eye, new THREE.SphereGeometry(0.042, 12, 12), eyeAmber, 0, 0, 0, 1, 1.05, 0.85);
      const pupil = addMesh(eye, new THREE.CapsuleGeometry(0.008, 0.032, 4, 8), eyePupil, 0, 0, 0.038);
      pupil.rotation.z = Math.PI / 2;
    }
    makeEye(-0.09);
    makeEye(0.09);

    function addWhisker(side, y, zAng) {
      const w = addMesh(
        head, new THREE.CylinderGeometry(0.004, 0.004, 0.28, 4), whiskerMat,
        side * 0.12, y, 0.22, 1, 1, 1, 0, 0, side * (Math.PI / 2 - 0.15) + zAng
      );
      w.castShadow = false;
    }
    [-1, 1].forEach((side) => {
      addWhisker(side, -0.02, side * -0.2);
      addWhisker(side, -0.05, side * 0.05);
      addWhisker(side, -0.08, side * 0.25);
    });

    function makeLeg(x, z, isFront) {
      const pivot = new THREE.Group();
      pivot.position.set(x, isFront ? 0.02 : -0.02, z);
      torso.add(pivot);
      addMesh(pivot, new THREE.BoxGeometry(0.1, 0.22, 0.12), fur, 0, -0.12, 0);
      const lower = addMesh(pivot, new THREE.BoxGeometry(0.09, 0.2, 0.1), furDark, 0, -0.3, 0.01);
      addMesh(pivot, new THREE.BoxGeometry(0.11, 0.06, 0.14), furDark, 0, -0.42, 0.02);
      return { pivot, lower, isFront };
    }
    const legs = [
      makeLeg(-0.14, 0.28, true),
      makeLeg(0.14, 0.28, true),
      makeLeg(-0.14, -0.3, false),
      makeLeg(0.14, -0.3, false),
    ];

    const tailRoot = new THREE.Group();
    tailRoot.position.set(0, 0.06, -0.5);
    torso.add(tailRoot);
    const tailSegs = [];
    let tailParent = tailRoot;
    for (let i = 0; i < 5; i++) {
      const seg = new THREE.Group();
      seg.position.set(0, i === 0 ? 0 : 0.02, i === 0 ? 0 : -0.13);
      tailParent.add(seg);
      const mat = i % 2 === 1 ? furStripe : furDark;
      const ww = 0.11 - i * 0.012;
      const hh = 0.1 - i * 0.01;
      addMesh(seg, new THREE.BoxGeometry(ww, hh, 0.14), mat, 0, 0, -0.07);
      seg.rotation.x = -0.12;
      tailSegs.push(seg);
      tailParent = seg;
    }
    tailRoot.rotation.set(-0.15, 0.35, 0.05);

    const catState = {
      yaw: Math.PI, // face south toward street initially
      walkSpeed: 3.4,
      runSpeed: 7.2,
      speed: 3.4,
      accel: 16,
      friction: 18,
      turnSpeed: 11,
      velX: 0,
      velZ: 0,
      velY: 0,
      onGround: true,
      jumpQueued: false,
      jumpForce: 6.8,
      gravity: 16,
      animTime: 0,
      gait: "idle",
      holdingYarn: false,
    };
    cat.rotation.y = catState.yaw;

    function requestJump() {
      if (catState.onGround) catState.jumpQueued = true;
    }

    function updateCatAnimation(dt, speedNow, moving) {
      if (!catState.onGround) {
        catState.gait = "jump";
        return;
      }
      const runThreshold = catState.walkSpeed * 0.72;
      let gait = "idle";
      if (moving && speedNow > 0.25) gait = speedNow > runThreshold ? "run" : "walk";
      catState.gait = gait;

      if (gait === "idle") {
        catState.animTime += dt;
        for (const leg of legs) {
          leg.pivot.rotation.x = THREE.MathUtils.damp(leg.pivot.rotation.x, 0, 8, dt);
          leg.lower.rotation.x = THREE.MathUtils.damp(leg.lower.rotation.x, 0, 8, dt);
        }
        torso.position.y = THREE.MathUtils.damp(torso.position.y, 0.38, 8, dt);
        torso.rotation.x = THREE.MathUtils.damp(torso.rotation.x, 0, 8, dt);
        head.rotation.x = THREE.MathUtils.damp(head.rotation.x, 0, 8, dt);
        const sway = Math.sin(catState.animTime * 1.6) * 0.1;
        tailRoot.rotation.z = THREE.MathUtils.damp(tailRoot.rotation.z, 0.05 + sway * 0.3, 4, dt);
        tailRoot.rotation.x = THREE.MathUtils.damp(tailRoot.rotation.x, -0.15, 4, dt);
        tailRoot.rotation.y = THREE.MathUtils.damp(tailRoot.rotation.y, 0.35 + sway, 4, dt);
        for (let i = 0; i < tailSegs.length; i++) {
          tailSegs[i].rotation.y = THREE.MathUtils.damp(
            tailSegs[i].rotation.y,
            Math.sin(catState.animTime * 1.6 - i * 0.4) * 0.1,
            4, dt
          );
          tailSegs[i].rotation.x = THREE.MathUtils.damp(tailSegs[i].rotation.x, -0.12, 4, dt);
        }
        return;
      }

      const isRun = gait === "run";
      catState.animTime += dt * (isRun ? 14 : 9) * (0.55 + speedNow / catState.runSpeed);
      const t = catState.animTime;
      if (isRun) {
        const swing = Math.sin(t) * 0.7;
        const rear = Math.sin(t + Math.PI) * 0.75;
        legs[0].pivot.rotation.x = swing;
        legs[1].pivot.rotation.x = swing * 0.92;
        legs[2].pivot.rotation.x = rear;
        legs[3].pivot.rotation.x = rear * 0.92;
        legs[0].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.5;
        legs[1].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.5;
        legs[2].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.55;
        legs[3].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.55;
        torso.position.y = 0.38 + Math.abs(Math.sin(t)) * 0.07;
        torso.rotation.x = Math.sin(t) * 0.12;
        head.rotation.x = -Math.sin(t) * 0.08;
        tailRoot.rotation.x = -0.05 + Math.sin(t) * 0.2;
        tailRoot.rotation.y = Math.sin(t * 0.5) * 0.15;
        for (let i = 0; i < tailSegs.length; i++) {
          tailSegs[i].rotation.x = -0.08 + Math.sin(t - i * 0.35) * 0.15;
          tailSegs[i].rotation.y = 0;
        }
      } else {
        const a = Math.sin(t) * 0.45;
        const b = Math.sin(t + Math.PI) * 0.45;
        legs[0].pivot.rotation.x = a;
        legs[3].pivot.rotation.x = a;
        legs[1].pivot.rotation.x = b;
        legs[2].pivot.rotation.x = b;
        legs[0].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.35;
        legs[3].lower.rotation.x = Math.max(0, -Math.sin(t)) * 0.35;
        legs[1].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.35;
        legs[2].lower.rotation.x = Math.max(0, -Math.sin(t + Math.PI)) * 0.35;
        torso.position.y = 0.38 + Math.abs(Math.sin(t * 2)) * 0.025;
        torso.rotation.x = Math.sin(t * 2) * 0.03;
        head.rotation.x = -Math.sin(t * 2) * 0.04;
        tailRoot.rotation.x = -0.12 + Math.sin(t) * 0.08;
        tailRoot.rotation.y = 0.25 + Math.sin(t * 0.5) * 0.2;
        for (let i = 0; i < tailSegs.length; i++) {
          tailSegs[i].rotation.y = Math.sin(t * 0.5 - i * 0.35) * 0.12;
          tailSegs[i].rotation.x = -0.1;
        }
      }
    }

    // ——— Interactives: front door + yarn in yard ———
    const yarnGroup = new THREE.Group();
    yarnGroup.position.set(11, 0.22, -7);
    scene.add(yarnGroup);
    const yarn = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xc45c26, roughness: 0.9 })
    );
    yarn.castShadow = true;
    yarnGroup.add(yarn);
    const swirlMat = new THREE.MeshStandardMaterial({ color: 0x9a3d14 });
    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.16 - i * 0.03, 0.018, 8, 24), swirlMat);
      ring.rotation.x = Math.PI / 2 + i * 0.4;
      ring.rotation.y = i * 0.7;
      yarnGroup.add(ring);
    }

    function makeMarker(color, x, z) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.5, 0.65, 32),
        new THREE.MeshBasicMaterial({
          color, transparent: true, opacity: 0.55, side: THREE.DoubleSide,
        })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(x, 0.04, z);
      scene.add(ring);
      return ring;
    }
    scene.updateMatrixWorld(true);
    const doorWorld = new THREE.Vector3();
    home18504.localToWorld(doorWorld.copy(home18504.userData.doorLocal));
    const doorMarker = makeMarker(0xf0c674, doorWorld.x, doorWorld.z);
    const yarnMarker = makeMarker(0xc45c26, yarnGroup.position.x, yarnGroup.position.z);

    const interactives = {
      door: {
        open: false,
        angle: 0,
        targetAngle: 0,
        getPos: () => {
          const p = new THREE.Vector3();
          home18504.localToWorld(p.copy(home18504.userData.doorLocal));
          return p;
        },
        radius: 3.6,
        labelClosed: "Tap E — Zoomer's front door",
        labelOpen: "Tap E to close the door",
      },
      yarn: {
        picked: false,
        getPos: () => yarnGroup.position.clone(),
        radius: 3.2,
        label: "Tap E to pick up the yarn",
      },
    };

    let nearest = null;
    let toastTimer = 0;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("visible");
      toastTimer = 2.2;
    }

    function tryInteract() {
      if (!nearest) return;
      if (nearest === "door") {
        interactives.door.open = !interactives.door.open;
        interactives.door.targetAngle = interactives.door.open ? -1.1 : 0;
        showToast(interactives.door.open ? "Zoomer nudged the front door open!" : "Door closed.");
        return;
      }
      if (nearest === "yarn" && !interactives.yarn.picked) {
        interactives.yarn.picked = true;
        catState.holdingYarn = true;
        yarnMarker.visible = false;
        showToast("Zoomer grabbed the yarn!");
      }
    }

    // ——— Input ———
    const keys = Object.create(null);
    const stick = { x: 0, y: 0, active: false, pointerId: null, originX: 0, originY: 0 };
    const isTouchUI =
      window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
    if (isTouchUI) document.body.classList.add("is-touch");

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "KeyE" || e.code === "Enter") {
        e.preventDefault();
        tryInteract();
      }
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    canvas.addEventListener("pointerdown", (e) => {
      if (isTouchUI) return;
      if (e.target === canvas && nearest) tryInteract();
    });
    const btnInteract = document.getElementById("btn-interact");
    btnInteract.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation(); tryInteract();
    });
    document.getElementById("btn-jump").addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation(); requestJump();
    });

    const stickZone = document.getElementById("stick-zone");
    const stickBase = stickZone.querySelector(".stick-base");
    const stickKnob = document.getElementById("stick-knob");
    // Smaller radius = full speed with a short thumb drag (easier on phones)
    const STICK_MAX = 38;
    const STICK_DEAD = 0.05;
    const STICK_SIZE = 150;

    function placeStickBase(clientX, clientY) {
      const size = STICK_SIZE;
      const x = THREE.MathUtils.clamp(clientX - size / 2, 4, window.innerWidth * 0.62 - size - 4);
      const y = THREE.MathUtils.clamp(
        clientY - size / 2,
        window.innerHeight * 0.12,
        window.innerHeight - size - 4
      );
      stickBase.style.left = `${x}px`;
      stickBase.style.top = `${y}px`;
      stickBase.style.bottom = "auto";
      stick.originX = x + size / 2;
      stick.originY = y + size / 2;
    }

    function setStickFromPointer(clientX, clientY) {
      let dx = clientX - stick.originX;
      let dy = clientY - stick.originY;
      let len = Math.hypot(dx, dy) || 1;

      // Keep stick at full tilt when thumb slides past the rim (easier continuous run)
      if (len > STICK_MAX) {
        const pull = len - STICK_MAX;
        stick.originX += (dx / len) * pull;
        stick.originY += (dy / len) * pull;
        // Keep the visible base roughly under the origin
        stickBase.style.left = `${stick.originX - STICK_SIZE / 2}px`;
        stickBase.style.top = `${stick.originY - STICK_SIZE / 2}px`;
        dx = clientX - stick.originX;
        dy = clientY - stick.originY;
        len = Math.hypot(dx, dy) || 1;
      }

      const clamped = Math.min(len, STICK_MAX);
      dx = (dx / len) * clamped;
      dy = (dy / len) * clamped;
      let nx = dx / STICK_MAX;
      let ny = dy / STICK_MAX;
      const mag = Math.hypot(nx, ny);
      if (mag < STICK_DEAD) {
        stick.x = 0; stick.y = 0;
      } else {
        // Gentle ease-in so small nudges still move, full tilt comes quick
        const shaped = Math.pow((mag - STICK_DEAD) / (1 - STICK_DEAD), 0.85);
        stick.x = (nx / mag) * Math.min(1, shaped);
        stick.y = (ny / mag) * Math.min(1, shaped);
      }
      stickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function resetStick() {
      stick.x = 0; stick.y = 0; stick.active = false; stick.pointerId = null;
      stickZone.classList.remove("active");
      stickKnob.style.transform = "translate(-50%, -50%)";
      stickBase.style.left = "18px";
      stickBase.style.top = "auto";
      stickBase.style.bottom = "max(24px, env(safe-area-inset-bottom))";
    }

    stickZone.addEventListener("pointerdown", (e) => {
      if (stick.active) return;
      e.preventDefault();
      stick.active = true;
      stick.pointerId = e.pointerId;
      stickZone.classList.add("active");
      placeStickBase(e.clientX, e.clientY);
      try { stickZone.setPointerCapture(e.pointerId); } catch (_) {}
      setStickFromPointer(e.clientX, e.clientY);
    });
    stickZone.addEventListener("pointermove", (e) => {
      if (!stick.active || e.pointerId !== stick.pointerId) return;
      e.preventDefault();
      setStickFromPointer(e.clientX, e.clientY);
    });
    function endStick(e) {
      if (stick.pointerId !== null && e.pointerId !== stick.pointerId) return;
      resetStick();
    }
    stickZone.addEventListener("pointerup", endStick);
    stickZone.addEventListener("pointercancel", endStick);
    stickZone.addEventListener("lostpointercapture", () => { if (stick.active) resetStick(); });

    // ——— Camera ———
    let camYaw = Math.PI;
    const camDist = 7.5;
    const camHeight = 4.2;
    const camLook = new THREE.Vector3();
    const camPos = new THREE.Vector3();

    function shortestAngle(from, to) {
      let d = ((to - from + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function updateCamera(dt) {
      // Lag yaw a bit for the same smooth feel, then sit behind Zoomer
      camYaw += shortestAngle(camYaw, catState.yaw) * (1 - Math.exp(-2.0 * dt));
      const desired = new THREE.Vector3(
        cat.position.x - Math.sin(camYaw) * camDist,
        cat.position.y + camHeight,
        cat.position.z - Math.cos(camYaw) * camDist
      );
      camPos.lerp(desired, 1 - Math.exp(-7 * dt));
      camera.position.copy(camPos);
      camLook.set(cat.position.x, cat.position.y + 0.75, cat.position.z);
      camera.lookAt(camLook);
    }

    // Robust occlusion: multi-ray + camera-inside / near-mesh fade
    const occludeRay = new THREE.Raycaster();
    const _box = new THREE.Box3();
    const _origin = new THREE.Vector3();
    const _target = new THREE.Vector3();
    const _dir = new THREE.Vector3();
    const _side = new THREE.Vector3();
    const _up = new THREE.Vector3(0, 1, 0);

    function updateOcclusion(dt) {
      _origin.copy(camera.position);
      _target.set(cat.position.x, cat.position.y + 0.65, cat.position.z);
      _dir.subVectors(_target, _origin);
      const dist = _dir.length();
      if (dist < 0.05) return;
      _dir.multiplyScalar(1 / dist);
      _side.crossVectors(_dir, _up).normalize();

      const blocking = new Set();
      const offsets = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0.35, 0),
        _side.clone().multiplyScalar(0.35),
        _side.clone().multiplyScalar(-0.35),
      ];

      for (const off of offsets) {
        const o = _origin.clone().add(off);
        const t = _target.clone().add(off);
        const d = t.clone().sub(o);
        const len = d.length();
        if (len < 0.05) continue;
        d.multiplyScalar(1 / len);
        occludeRay.set(o, d);
        occludeRay.near = 0.02;
        occludeRay.far = len;
        const hits = occludeRay.intersectObjects(occluders, false);
        for (const hit of hits) {
          if (hit.distance < len - 0.02) blocking.add(hit.object);
        }
      }

      // Also ghost meshes the camera is inside or extremely close to
      for (const mesh of occluders) {
        _box.setFromObject(mesh);
        if (_box.containsPoint(_origin) || _box.distanceToPoint(_origin) < 0.85) {
          blocking.add(mesh);
        }
      }

      for (const mesh of occluders) {
        const want = blocking.has(mesh) ? OCCLUDE_OPACITY : 1;
        // Snap faster so “see-through” is obvious on phones
        mesh.userData.fade = THREE.MathUtils.damp(mesh.userData.fade, want, 18, dt);
        const mat = mesh.material;
        if (Array.isArray(mat)) continue;
        mat.transparent = true;
        mat.opacity = mesh.userData.fade;
        mat.depthWrite = mesh.userData.fade > 0.92;
        mesh.renderOrder = mesh.userData.fade < 0.95 ? 2 : 0;
        mesh.castShadow = mesh.userData.fade > 0.55;
      }
    }

    // Soft playable bounds around the cul-de-sac block
    const BOUNDS = { minX: -55, maxX: 70, minZ: -40, maxZ: 45 };
    function clampCat() {
      cat.position.x = THREE.MathUtils.clamp(cat.position.x, BOUNDS.minX, BOUNDS.maxX);
      cat.position.z = THREE.MathUtils.clamp(cat.position.z, BOUNDS.minZ, BOUNDS.maxZ);
    }

    // Soft collide with house footprints (AABB in XZ)
    const houseBlocks = [];
    scene.traverse((obj) => {
      if (obj.isGroup && obj.userData && (obj.userData.label || obj.userData.home)) {
        // Approximate local footprint
        houseBlocks.push({ group: obj, hw: 6.5, hd: 7.5 });
      }
    });

    function resolveHouseCollisions() {
      for (const hb of houseBlocks) {
        const local = hb.group.worldToLocal(cat.position.clone());
        if (Math.abs(local.x) < hb.hw && Math.abs(local.z) < hb.hd) {
          const px = hb.hw - Math.abs(local.x);
          const pz = hb.hd - Math.abs(local.z);
          if (px < pz) local.x = Math.sign(local.x || 1) * hb.hw;
          else local.z = Math.sign(local.z || 1) * hb.hd;
          const world = hb.group.localToWorld(local);
          cat.position.x = world.x;
          cat.position.z = world.z;
        }
      }
    }

    // ——— Loop ———
    const clock = new THREE.Clock();
    let markerPulse = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      markerPulse += dt;

      let ix = 0, iz = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) iz -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) iz += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) ix -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) ix += 1;
      ix += stick.x;
      iz += stick.y;
      const inputLen = Math.hypot(ix, iz);
      if (inputLen > 1) { ix /= inputLen; iz /= inputLen; }

      const sinY = Math.sin(camYaw);
      const cosY = Math.cos(camYaw);
      const fwdX = -sinY, fwdZ = -cosY;
      const rightX = cosY, rightZ = -sinY;
      const dirX = fwdX * -iz + rightX * ix;
      const dirZ = fwdZ * -iz + rightZ * ix;
      const wishLen = Math.hypot(dirX, dirZ);
      const moving = wishLen > 0.001 && inputLen > 0.02;
      // Phones: any real stick tilt = run (Zoomer zooms). Desktop keeps Shift / hard push.
      const wantRun = moving && (
        isTouchUI
          ? inputLen > 0.18
          : (inputLen > 0.65 || keys["ShiftLeft"] || keys["ShiftRight"])
      );
      catState.speed = wantRun ? catState.runSpeed : catState.walkSpeed;

      let targetVX = 0, targetVZ = 0;
      if (moving) {
        const scale = Math.min(inputLen, 1) * catState.speed;
        targetVX = (dirX / wishLen) * scale;
        targetVZ = (dirZ / wishLen) * scale;
        const desiredYaw = Math.atan2(dirX, dirZ);
        catState.yaw += shortestAngle(catState.yaw, desiredYaw) * (1 - Math.exp(-catState.turnSpeed * dt));
        cat.rotation.y = catState.yaw;
      }

      const rate = moving ? catState.accel : catState.friction;
      const blend = 1 - Math.exp(-rate * dt);
      catState.velX += (targetVX - catState.velX) * blend;
      catState.velZ += (targetVZ - catState.velZ) * blend;
      cat.position.x += catState.velX * dt;
      cat.position.z += catState.velZ * dt;

      const speedNow = Math.hypot(catState.velX, catState.velZ);
      updateCatAnimation(dt, speedNow, moving || speedNow > 0.2);

      if ((keys["Space"] || keys["KeyJ"] || catState.jumpQueued) && catState.onGround) {
        catState.velY = catState.jumpForce;
        catState.onGround = false;
        catState.jumpQueued = false;
        for (const leg of legs) {
          leg.pivot.rotation.x = -0.55;
          leg.lower.rotation.x = 0.7;
        }
        torso.rotation.x = -0.15;
      } else {
        catState.jumpQueued = false;
      }
      catState.velY -= catState.gravity * dt;
      cat.position.y += catState.velY * dt;
      if (!catState.onGround) {
        const tuck = catState.velY > 0 ? -0.45 : -0.2;
        for (const leg of legs) {
          leg.pivot.rotation.x = THREE.MathUtils.damp(leg.pivot.rotation.x, tuck, 10, dt);
        }
        torso.position.y = THREE.MathUtils.damp(torso.position.y, 0.34, 8, dt);
        tailRoot.rotation.x = THREE.MathUtils.damp(tailRoot.rotation.x, 0.35, 8, dt);
      }
      if (cat.position.y <= 0) {
        cat.position.y = 0;
        catState.velY = 0;
        catState.onGround = true;
      }

      clampCat();
      resolveHouseCollisions();

      // Door swing on home
      interactives.door.angle = THREE.MathUtils.damp(
        interactives.door.angle, interactives.door.targetAngle, 6, dt
      );
      if (home18504.userData.door) {
        home18504.userData.door.rotation.y = interactives.door.angle;
      }

      if (catState.holdingYarn) {
        const hold = new THREE.Vector3(0.35, 0.55, 0.15);
        hold.applyAxisAngle(new THREE.Vector3(0, 1, 0), catState.yaw);
        yarnGroup.position.lerp(cat.position.clone().add(hold), 1 - Math.pow(0.0001, dt));
        yarnGroup.position.y = 0.55 + Math.sin(markerPulse * 4) * 0.04;
        yarnGroup.rotation.y += dt * 2;
      } else {
        yarnGroup.position.y = 0.22 + Math.sin(markerPulse * 3) * 0.03;
        yarnGroup.rotation.y += dt * 0.8;
      }

      const pulse = 0.4 + Math.sin(markerPulse * 3) * 0.2;
      doorMarker.material.opacity = pulse;
      if (yarnMarker.visible) yarnMarker.material.opacity = pulse;

      nearest = null;
      let bestDist = Infinity;
      const catXZ = new THREE.Vector2(cat.position.x, cat.position.z);
      function horizDist(pos) {
        return catXZ.distanceTo(new THREE.Vector2(pos.x, pos.z));
      }
      const dDoor = horizDist(interactives.door.getPos());
      if (dDoor < interactives.door.radius && dDoor < bestDist) {
        nearest = "door"; bestDist = dDoor;
      }
      if (!interactives.yarn.picked) {
        const dYarn = horizDist(interactives.yarn.getPos());
        if (dYarn < interactives.yarn.radius && dYarn < bestDist) {
          nearest = "yarn"; bestDist = dYarn;
        }
      }
      if (nearest === "door") {
        promptEl.textContent = interactives.door.open
          ? interactives.door.labelOpen
          : interactives.door.labelClosed;
        promptEl.classList.add("visible");
      } else if (nearest === "yarn") {
        promptEl.textContent = interactives.yarn.label;
        promptEl.classList.add("visible");
      } else {
        promptEl.classList.remove("visible");
      }
      // Light up the E button when something is in range (mobile clarity)
      if (nearest) btnInteract.classList.add("ready");
      else btnInteract.classList.remove("ready");

      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toastEl.classList.remove("visible");
      }

      updateCamera(dt);
      updateOcclusion(dt);
      renderer.render(scene, camera);
    }

    camPos.set(
      cat.position.x + Math.sin(camYaw) * camDist,
      camHeight,
      cat.position.z + Math.cos(camYaw) * camDist
    );
    camera.position.copy(camPos);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
